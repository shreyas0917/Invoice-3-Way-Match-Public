# Error texts by stable code. Change wording here, never in code.
# {0}, {1}, ... are filled from the error's args.

# --- S/4 facade -----------------------------------------------------------------
SUPPLIER_NOT_FOUND=Supplier {0} does not exist.
PO_NOT_FOUND=Purchase order {0} does not exist.

# --- Declarative checks (db/schema.cds) ---------------------------------------
INVOICE_DATE_IN_FUTURE=The invoice date must not be in the future.
TAX_AMOUNT_NEGATIVE=The tax amount must not be negative.
GROSS_AMOUNT_NOT_POSITIVE=The gross amount must be greater than 0.
ITEM_QUANTITY_NOT_POSITIVE=The quantity must be greater than 0.
ITEM_UNIT_PRICE_NOT_POSITIVE=The unit price must be greater than 0.

# --- Submission rules V1-V10 (srv/lib/invoice-validation.js) -------------------
# V1
INVOICE_GROSS_MISMATCH=Gross amount {0} must equal net amount plus tax ({1}), within 0.01.
# V2
INVOICE_NET_MISMATCH=Net amount {0} must equal the sum of the item net amounts ({1}), within 0.01.
# V3
INVOICE_NO_ITEMS=Add at least one item before saving the invoice.
ITEM_NUMBER_DUPLICATE=Item number {0} is used more than once.
ITEM_NET_AMOUNT_MISMATCH=Item {0}: net amount {1} must equal quantity times unit price ({2}), within 0.01.
# V4
SUPPLIER_POSTING_BLOCKED=Supplier {0} is blocked for posting.
# V5
PO_DELETED=Purchase order {0} is deleted and cannot be invoiced.
# V6
PO_SUPPLIER_MISMATCH=Supplier {0} does not match purchase order {1}, which belongs to supplier {2}.
# V7
COMPANY_CODE_MISMATCH=Company code {0} does not match purchase order {1}, which belongs to company code {2}.
# V8
CURRENCY_MISMATCH=Currency {0} does not match the currency of purchase order {1} ({2}).
# V9
PO_ITEM_NOT_FOUND=PO item {0} does not exist on purchase order {1}.
PO_ITEM_DELETED=PO item {0} of purchase order {1} is deleted.
ITEM_UNIT_MISMATCH=Unit {0} does not match the unit of PO item {1} ({2}).
# V10
INVOICE_DATE_BEFORE_PO_DATE=Invoice date {0} is before the order date of purchase order {1} ({2}).

# --- Duplicates ------------------------------------------------------------------
# D1
DUPLICATE_INVOICE=Supplier reference {0} of supplier {1} was already submitted in fiscal year {2} as invoice {3}.

# --- Matching (phase 4) -----------------------------------------------------------
INVALID_STATUS_TRANSITION=Action {0} is not allowed for an invoice in status {1}.
MATCH_REQUIRES_SAVED_INVOICE=Save the invoice before matching it.
# warnings
NO_TOLERANCE_RULE=No {0} tolerance rule applies to company code {1} on {2}: zero tolerance was used.
TOLERANCE_RULE_CURRENCY_MISMATCH=The {0} tolerance rule is in {1}, the invoice in {2}: zero tolerance was used.
NO_APPROVAL_POLICY=Company code {0} has no approval policy: the invoice needs AP Manager approval.
APPROVAL_POLICY_CURRENCY_MISMATCH=The approval policy of company code {0} is in {1}, the invoice in {2}: the invoice needs AP Manager approval.

# --- Tolerance rules (AdminService) -----------------------------------------------
TOLERANCE_PERCENT_RANGE=A tolerance percentage must be between 0 and 100.
TOLERANCE_ABSOLUTE_NEGATIVE=An absolute tolerance must not be negative.
TOLERANCE_VALID_TO_BEFORE_FROM=Valid to must not be before valid from.
TOLERANCE_RULE_OVERLAP=Another active {0} rule for company code {1} is valid in this period ({2} to {3}).

# --- Status actions (phase 5) -------------------------------------------------------
SAVED_INVOICE_REQUIRED=Save the invoice before using {0}.
REASON_REQUIRED=Enter a reason.
COMMENT_REQUIRED=Enter a comment.
SOD_SELF_APPROVAL=You created this invoice, so you cannot approve it. Another AP Manager must approve it.
ACTIVE_INVOICE_NOT_DELETABLE=Submitted invoices cannot be deleted. Block and cancel the invoice instead.

# --- Exception resolution (phase 5) -------------------------------------------------
EXCEPTION_NOT_OPEN=This exception is already {0} and cannot be resolved again.
INVALID_RESOLUTION=Resolution {0} is unknown. Use ACCEPT, REMATCH or REJECT.
RESOLUTION_NOT_ALLOWED=Resolution {0} is not allowed for a {1} exception.
NOTE_REQUIRED=Enter a note explaining the decision.

# --- S/4 facade (phase 8) -------------------------------------------------------------
S4_UNAVAILABLE=The S/4HANA system is not available right now. Nothing was changed; please try again later.
S4_DATA_UNSUPPORTED=S/4HANA returned purchase order or goods receipt data this application cannot process automatically (for example an unsupported unit or movement type). Nothing was changed. Retrying will not help - please check the purchase order in S/4HANA or process this invoice manually.
